name: ci
# Single required check `ci`: Python pipeline (ruff, mypy, pytest unit + acceptance) and the web
# app (eslint, prettier, tsc, vitest, build, Playwright acceptance), plus the REQ-010 raw-data check.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Raw-data check (REQ-010)
        run: python3 scripts/check_raw_data.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (Python)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install (web)
        run: npm --prefix web ci

      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Typecheck (mypy)
        run: mypy
      - name: Lint (eslint)
        run: npm --prefix web run lint
      - name: Format check (prettier)
        run: npm --prefix web run format:check
      - name: Typecheck (tsc)
        run: npm --prefix web run typecheck

      - name: Unit tests (pytest)
        run: pytest tests/unit
      - name: Unit tests (vitest)
        run: npm --prefix web test

      - name: Acceptance tests (pipeline, pytest)
        run: pytest tests/acceptance/pipeline

      - name: Install Playwright browser
        run: cd web && npx playwright install --with-deps chromium
      - name: Acceptance tests (web, Playwright)
        run: npm --prefix web run test:acceptance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
