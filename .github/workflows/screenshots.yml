name: screenshots
# Web UI projects only. Not a required check. Images are a run artifact; the Lead commits them at milestone end.
# Captures every screen in docs/PLAN.md "Screens" from the site built with the synthetic
# tests/acceptance/web/site-data (tests/screenshots/screenshots.spec.ts) -> screenshots/*.png.
on:
  pull_request:
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        # Browser binaries come from the cache; the (slow, apt-based) system deps are installed only
        # when chromium cannot launch without them.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi
          if ! node -e "require('@playwright/test').chromium.launch().then(b => b.close())"; then
            echo "chromium cannot launch (error above); installing system deps"
            npx playwright install-deps chromium
            node -e "require('@playwright/test').chromium.launch().then(b => b.close())"
          fi
      - run: npm run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
