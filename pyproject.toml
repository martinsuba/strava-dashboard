[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdash"
version = "0.0.1"
description = "Strava export -> segment efforts -> static site (strava-dashboard pipeline)"
requires-python = ">=3.12"
dependencies = [
    "fitdecode==0.11.0",
    "gpxpy==1.6.2",
    "PyYAML==6.0.3",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
sdash = "sdash.cli:main"

[tool.setuptools]
packages = ["sdash"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mutants"]  # web/node_modules is skipped via .gitignore

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# long assertion messages and test names read better unwrapped; the formatter handles code
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sdash"]

[[tool.mypy.overrides]]
module = ["fitdecode", "fitdecode.*", "gpxpy", "gpxpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/acceptance/pipeline"]
xfail_strict = true
addopts = "-ra"
markers = [
    "req(id): the PRD requirement (REQ-xxx) an acceptance test covers",
]

[tool.mutmut]
source_paths = ["sdash/match.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_match.py", "tests/unit/test_pipeline.py"]
